<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>Saldo — Controle Financeiro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient"></div>
  <main>
    <section class="auth view active" id="authView">
      <div class="brand-mark">S<span>.</span></div>
      <div class="auth-card glass">
        <div class="tabs">
          <button class="tab active" data-auth="login">Entrar</button>
          <button class="tab" data-auth="register">Cadastrar</button>
        </div>
        <form id="authForm" class="form-stack">
          <div class="field register-only"><label>Nome</label><input name="name" autocomplete="name" placeholder="Seu nome"></div>
          <div class="field"><label>E-mail</label><input type="email" name="email" autocomplete="email" required placeholder="voce@email.com"></div>
          <div class="field"><label>Senha</label><input type="password" name="password" autocomplete="current-password" required minlength="4" placeholder="••••••••"></div>
          <p class="message" id="authMessage"></p>
          <button class="primary" id="authSubmit" type="submit">Entrar</button>
        </form>
      </div>
    </section>

    <section class="view dashboard" id="dashboardView">
      <header>
        <div><div class="brand-mark small">S<span>.</span></div><p id="welcome">Olá</p></div>
        <button class="icon-button" id="logout" aria-label="Sair">↗</button>
      </header>

      <div class="summary-grid">
        <article class="balance-card glass"><span>Saldo disponível</span><strong id="balance">R$ 0,00</strong><small id="balanceStatus">Tudo sob controle</small></article>
        <article class="mini-card glass"><span>Entradas</span><strong class="positive" id="income">R$ 0,00</strong></article>
        <article class="mini-card glass"><span>Saídas</span><strong class="negative" id="expenses">R$ 0,00</strong></article>
      </div>

      <section class="editor glass">
        <div class="section-heading"><div><small>Planejamento mensal</small><h2>Organize suas contas</h2></div><button class="soft-button" id="editToggle">Editar</button></div>
        <form id="financeForm">
          <div class="field income-field"><label>Quanto você recebe</label><div class="money-input"><span>R$</span><input name="income" type="number" min="0" step="0.01" placeholder="0,00"></div></div>
          <div class="bill-grid">
            <div class="field"><label>Água</label><div class="money-input"><span>R$</span><input name="water" type="number" min="0" step="0.01" placeholder="0,00"></div></div>
            <div class="field"><label>Luz</label><div class="money-input"><span>R$</span><input name="electricity" type="number" min="0" step="0.01" placeholder="0,00"></div></div>
            <div class="field"><label>Internet</label><div class="money-input"><span>R$</span><input name="internet" type="number" min="0" step="0.01" placeholder="0,00"></div></div>
          </div>
          <div class="section-heading pending-heading"><div><small>Pagamentos</small><h3>Pendências</h3></div><button type="button" class="soft-button add" id="addPayment">+ Adicionar</button></div>
          <div id="pendingList" class="pending-list"></div>
          <button class="primary save-button" type="submit">Salvar movimentação</button>
        </form>
      </section>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
